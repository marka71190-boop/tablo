<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Табло · Пирамида</title>
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Roboto Condensed',system-ui,sans-serif;background:#070b16;color:#e9edf5;min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{font:600 24px Oswald;text-transform:uppercase;letter-spacing:2px}
h1 b{color:#e4002b}
.tabs{display:flex;gap:4px;background:#0f1628;border:1px solid #1d2742;border-radius:12px;padding:4px;margin-bottom:16px;overflow-x:auto}
.tabs button{flex:1;background:transparent;border:0;color:#aab4cb;padding:11px 14px;border-radius:9px;font:600 16px Oswald;text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.tabs button.act{background:#e4002b;color:#fff}
.view{display:none}.view.act{display:block}
.card{background:#0e1527;border:1px solid #1d2742;border-radius:14px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.in{background:#070b16;border:1px solid #26314f;color:#fff;border-radius:10px;padding:11px 12px;font-size:16px;min-width:0}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;font-size:15px;color:#fff;background:#e4002b;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.g{background:#11793f}.btn.s{background:#141d33;border:1px solid #26314f;color:#e9edf5}.btn.d{background:#3a0b16;border:1px solid #8a1426;color:#ffb3bd}
.btn.sm{padding:8px 12px;font-size:14px}
.tname{font:600 22px Oswald;text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.live{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:#070b16;border-radius:10px;padding:12px;margin:10px 0}
.live .n{font:500 17px Oswald;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live .n.r{text-align:right}
.live .sc{font:700 30px Oswald;white-space:nowrap}
.live .sc i{font-style:normal;color:#e4002b;margin:0 6px}
.muted{color:#8590aa;font-size:14px}
.pl{display:flex;gap:12px;align-items:center}
.ava{width:64px;height:76px;border-radius:10px;background:#141d33 center/cover;flex:none;border:1px solid #26314f;display:grid;place-items:center;color:#4b5672;font:700 24px Oswald}
.pl .nm{font:600 20px Oswald;text-transform:uppercase}
.pl .st{font-size:14px;color:#aab4cb;margin-top:2px}
.pl .st b{color:#fff}
.m{border-top:1px solid #1d2742;padding:12px 0}
.m:first-child{border-top:0}
.mh{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;cursor:pointer}
.md{font-size:13px;color:#8590aa;white-space:nowrap}
.mt{font-size:14px;color:#aab4cb}
.ms{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:4px}
.ms .a,.ms .b{font:600 18px Oswald;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms .b{text-align:right}
.ms .w{color:#ffd166}
.ms .sc{font:700 24px Oswald}
.det{display:none;margin-top:10px;background:#070b16;border-radius:10px;padding:10px;font-size:14px}
.m.open .det{display:block}
.det table{width:100%;border-collapse:collapse}
.det td{padding:5px 6px;border-top:1px solid #141d33}
.det td:first-child,.det td:last-child{font:600 16px Oswald;width:70px}
.det td:last-child{text-align:right}
.det td.l{text-align:center;color:#aab4cb}
.warn{background:#3a2a0b;border:1px solid #8a6a14;color:#ffd166;border-radius:12px;padding:12px;margin-bottom:14px;font-size:14px;line-height:1.45}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;background:#11793f;color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;transition:.3s;z-index:9;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}.toast.err{background:#8a1426}
.empty{color:#8590aa;text-align:center;padding:30px 10px}
h3{font:600 17px Oswald;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;color:#aab4cb}
.edit{display:none;margin-top:10px;gap:8px;flex-wrap:wrap}
.pform{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pform label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#aab4cb;min-width:0}
.pform .w2{grid-column:span 2}
.pform .in{width:100%}
.edit .pform{width:100%}
.info{font-size:13px;color:#8590aa;margin-top:4px}
@media(max-width:600px){.pform{grid-template-columns:1fr 1fr}}
.editing .edit{display:flex}
input[type=file].in{padding:8px;font-size:14px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.mh{grid-template-columns:1fr auto}.mh .md{grid-column:span 2}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><b>●</b> Табло · Пирамида</h1>
    <button class="btn s sm" id="logout">Выйти</button>
  </header>
  <div id="warns"></div>
  <nav class="tabs">
    <button data-tab="tables" class="act">Столы</button>
    <button data-tab="players">Игроки</button>
    <button data-tab="history">История</button>
    <button data-tab="settings">Настройки</button>
  </nav>

  <section class="view act" id="v-tables">
    <div class="card" style="margin-bottom:12px">
      <form class="row" id="addTable"><input class="in" id="tName" placeholder="Название стола, например «Стол 2»" style="flex:1"><button class="btn">+ Добавить стол</button></form>
    </div>
    <div class="grid" id="tables"></div>
  </section>

  <section class="view" id="v-players">
    <div class="card" style="margin-bottom:12px">
      <h3>Новый игрок</h3>
      <form id="addPlayer">
        <div class="pform" data-form></div>
        <div class="row" style="margin-top:10px"><button class="btn">+ Добавить игрока</button></div>
      </form>
    </div>
    <input class="in" id="pFilter" placeholder="Поиск игрока" style="width:100%;margin-bottom:12px">
    <div class="grid" id="players"></div>
  </section>

  <section class="view" id="v-history">
    <div class="card" style="margin-bottom:12px">
      <div class="row">
        <input class="in" id="hFilter" placeholder="Поиск: игрок, турнир, стол" style="flex:1 1 220px">
        <a class="btn s" href="/api/matches.csv">⬇ Скачать таблицу (CSV)</a>
      </div>
    </div>
    <div class="card" id="history"></div>
  </section>

  <section class="view" id="v-settings">
    <div class="card" style="margin-bottom:12px">
      <h3>Хранение данных</h3>
      <div id="storageInfo" class="muted" style="line-height:1.5"></div>
    </div>
    <div class="card">
      <h3>Резервная копия</h3>
      <p class="muted" style="margin-bottom:12px">Все столы, игроки с фото и история матчей одним файлом. Сохраняйте копию перед обновлением сайта, если база данных не подключена.</p>
      <div class="row">
        <a class="btn s" href="/api/backup">⬇ Скачать копию</a>
        <label class="btn s">⬆ Восстановить из файла<input type="file" accept=".json,application/json" id="restore" hidden></label>
      </div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t,err){const e=$('toast');e.textContent=t;e.classList.toggle('err',!!err);e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}
async function api(url,opt={}){
  const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===401){ location.href='/login'; throw 0; }
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ toast(j.error||'Ошибка',true); throw j; }
  return j;
}
function confirmBtn(btn,fn,txt='Точно?'){
  if(btn._arm){ btn._arm=false; fn(); return; }
  const old=btn.textContent; btn._arm=true; btn.textContent=txt;
  setTimeout(()=>{ btn._arm=false; btn.textContent=old; },2500);
}
function resizePhoto(file,max=800){
  return new Promise((ok,no)=>{
    if(!file) return ok(null);
    const alpha=/png|webp|gif/.test(file.type);
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); ok(alpha?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.85));
    };img.onerror=no;img.src=r.result};
    r.onerror=no; r.readAsDataURL(file);
  });
}
const photoUrl=id=>id?'/photos/'+id+'.jpg':'';
const COUNTRIES=[['ru','Россия'],['by','Беларусь'],['kz','Казахстан'],['ua','Украина'],['uz','Узбекистан'],['kg','Киргизия'],['tj','Таджикистан'],['am','Армения'],['az','Азербайджан'],['ge','Грузия'],['md','Молдова'],['lv','Латвия'],['lt','Литва'],['ee','Эстония'],['fi','Финляндия'],['de','Германия'],['none','— без флага —']];
const INFO=[['city','Город'],['age','Возраст'],['height','Рост'],['rank','Звание'],['club','Клуб'],['cue','Кий']];
function formHTML(p){ p=p||{};
  return `<label class="w2">Имя и фамилия<input class="in" name="name" value="${esc(p.name||'')}" required></label>
   <label>Страна<select class="in" name="country">${COUNTRIES.map(([k,n])=>`<option value="${k}" ${k===(p.country||'ru')?'selected':''}>${n}</option>`).join('')}</select></label>
   ${INFO.map(([k,l])=>`<label>${l}<input class="in" name="${k}" value="${esc(p[k]||'')}"></label>`).join('')}
   <label class="w2">Фото (аватар)<input class="in" type="file" accept="image/*" name="photo"></label>
   <label class="w2">Фото в полный рост (PNG без фона)<input class="in" type="file" accept="image/*" name="body"></label>`;
}
async function formData(root){
  const g=n=>root.querySelector(`[name="${n}"]`), o={name:g('name').value,country:g('country').value};
  INFO.forEach(([k])=>o[k]=g(k).value);
  const ph=await resizePhoto(g('photo').files[0],800); if(ph) o.photo=ph;
  const bd=await resizePhoto(g('body').files[0],1200); if(bd) o.body=bd;
  return o;
}
const initials=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();

/* ---------- tabs ---------- */
function showTab(t){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('act',b.dataset.tab===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('act',v.id==='v-'+t));
  if(location.hash!=='#'+t) history.replaceState(null,'','#'+t);
  if(t==='tables') loadTables(); if(t==='players') loadPlayers(); if(t==='history') loadHistory();
}
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button'); if(b) showTab(b.dataset.tab)};

/* ---------- tables ---------- */
let TABLES=[];
async function loadTables(){
  TABLES=await api('/api/tables');
  $('tables').innerHTML=TABLES.length?TABLES.map(t=>{
    const L=t.live, a=L&&L.players[0]||{}, b=L&&L.players[1]||{};
    return `<div class="card" data-id="${t.id}">
      <div class="tname"><span>${esc(t.name)}</span><span class="muted">${L?esc(L.title||''):'нет матча'}</span></div>
      <div class="live"><div class="n">${esc(a.name||'—')}</div><div class="sc">${a.frames??0}<i>:</i>${b.frames??0}</div><div class="n r">${esc(b.name||'—')}</div></div>
      <div class="row">
        <a class="btn" href="/t/${t.id}">Открыть пульт</a>
        <button class="btn s" data-copy="${location.origin}/o/${t.id}">Ссылка для OBS</button>
        <button class="btn s sm" data-ren="${t.id}">✎</button>
        <button class="btn d sm" data-del="${t.id}">Удалить</button>
      </div>
      <div class="edit"><input class="in" value="${esc(t.name)}" style="flex:1"><button class="btn g sm" data-save="${t.id}">Сохранить</button></div>
    </div>`}).join(''):'<div class="empty">Столов пока нет — добавьте первый.</div>';
}
$('addTable').onsubmit=async e=>{e.preventDefault(); await api('/api/tables',{method:'POST',body:{name:$('tName').value}}); $('tName').value=''; toast('Стол добавлен'); loadTables();};
$('tables').onclick=async e=>{
  const b=e.target.closest('button'); if(!b) return;
  const card=b.closest('[data-id]');
  if(b.dataset.copy){ try{await navigator.clipboard.writeText(b.dataset.copy); toast('Ссылка для OBS скопирована');}catch(_){ prompt('Ссылка для OBS:',b.dataset.copy); } }
  if(b.dataset.ren) card.classList.toggle('editing');
  if(b.dataset.save){ await api('/api/tables/'+b.dataset.save,{method:'PATCH',body:{name:card.querySelector('.edit input').value}}); toast('Сохранено'); loadTables(); }
  if(b.dataset.del) confirmBtn(b,async()=>{ await api('/api/tables/'+b.dataset.del,{method:'DELETE'}); toast('Стол удалён'); loadTables(); },'Удалить стол?');
};

/* ---------- players ---------- */
let PLAYERS=[], MATCHES=null;
async function ensureMatches(){ if(!MATCHES) MATCHES=await api('/api/matches'); return MATCHES; }
function statsFor(p){
  let n=0,w=0,fw=0,fl=0;
  for(const m of MATCHES||[]){
    const i=m.players.findIndex(x=>(x.playerId&&x.playerId===p.id)||(!x.playerId&&x.name.trim().toLowerCase()===p.name.trim().toLowerCase()));
    if(i<0) continue; n++; if(m.winner===i) w++; fw+=m.players[i].frames; fl+=m.players[1-i].frames;
  }
  return {n,w,fw,fl};
}
async function loadPlayers(){
  [PLAYERS]=await Promise.all([api('/api/players'),ensureMatches()]);
  renderPlayers();
}
function renderPlayers(){
  const f=$('pFilter').value.trim().toLowerCase();
  const list=PLAYERS.filter(p=>!f||p.name.toLowerCase().includes(f));
  $('players').innerHTML=list.length?list.map(p=>{const s=statsFor(p);return `<div class="card" data-id="${p.id}">
    <div class="pl"><div class="ava" style="${p.photoId?`background-image:url(${photoUrl(p.photoId)})`:''}">${p.photoId?'':esc(initials(p.name))}</div>
      <div style="min-width:0;flex:1"><div class="nm">${esc(p.name)}</div>
      <div class="st">Матчей <b>${s.n}</b> · Побед <b>${s.w}</b>${s.n?` · <b>${Math.round(s.w/s.n*100)}%</b>`:''}</div>
      <div class="st">Партии <b>${s.fw}</b> : <b>${s.fl}</b></div>
      <div class="info">${esc([p.city,p.age&&p.age+' лет',p.height&&p.height+' см',p.rank,p.club,p.cue&&'кий: '+p.cue].filter(Boolean).join(' · '))}${p.bodyId?' · фото в рост ✓':''}</div></div></div>
    <div class="row" style="margin-top:10px">
      <button class="btn s sm" data-hist="${esc(p.name)}">Матчи игрока</button>
      <button class="btn s sm" data-ed="1">✎ Изменить</button>
      <button class="btn d sm" data-del="${p.id}">Удалить</button>
    </div>
    <div class="edit"><div class="pform">${formHTML(p)}</div>
      <button class="btn g sm" data-save="${p.id}">Сохранить</button>${p.photoId?`<button class="btn s sm" data-nophoto="${p.id}">Убрать фото</button>`:''}${p.bodyId?`<button class="btn s sm" data-nobody="${p.id}">Убрать фото в рост</button>`:''}</div>
  </div>`}).join(''):'<div class="empty">Игроков пока нет. Добавьте их — потом на пульте можно будет выбрать игрока из списка, и фото подставится само.</div>';
}
$('pFilter').oninput=renderPlayers;
$('addPlayer').onsubmit=async e=>{
  e.preventDefault(); const btn=e.submitter; btn.disabled=true;
  try{ const f=document.querySelector('#addPlayer [data-form]'); await api('/api/players',{method:'POST',body:await formData(f)});
    f.innerHTML=formHTML(); toast('Игрок добавлен'); loadPlayers(); }
  finally{ btn.disabled=false; }
};
$('players').onclick=async e=>{
  const b=e.target.closest('button'); if(!b) return; const card=b.closest('[data-id]');
  if(b.dataset.ed) card.classList.toggle('editing');
  if(b.dataset.hist){ $('hFilter').value=b.dataset.hist; showTab('history'); }
  if(b.dataset.save){ b.disabled=true; try{ await api('/api/players/'+b.dataset.save,{method:'PATCH',body:await formData(card.querySelector('.edit .pform'))}); toast('Сохранено'); loadPlayers(); } finally{ b.disabled=false; } }
  if(b.dataset.nobody){ await api('/api/players/'+b.dataset.nobody,{method:'PATCH',body:{body:''}}); loadPlayers(); }
  if(b.dataset.nophoto){ await api('/api/players/'+b.dataset.nophoto,{method:'PATCH',body:{photo:''}}); loadPlayers(); }
  if(b.dataset.del) confirmBtn(b,async()=>{ await api('/api/players/'+b.dataset.del,{method:'DELETE'}); toast('Игрок удалён'); loadPlayers(); },'Удалить?');
};

/* ---------- history ---------- */
const DET=[['Забито шаров',p=>p.foreign+p.own+(p.luck||0)],['Чужих',p=>p.foreign],['Своих',p=>p.own],['Случайных',p=>p.luck||0],['Начальный удар',p=>(p.breaksOk||0)+'/'+(p.breaks||0)],['Лучшая серия',p=>p.best],['Атаки',p=>p.attacks],
  ['Реализация',p=>p.attacks?Math.round((p.foreign+p.own)/p.attacks*100)+'%':'—'],['Отыгрыши',p=>p.safeties],['Фолы',p=>p.fouls],
  ['Время на удар',p=>p.shots?Math.round(p.time/p.shots/1000)+' с':'—']];
async function loadHistory(){ MATCHES=await api('/api/matches'); renderHistory(); }
function renderHistory(){
  const f=$('hFilter').value.trim().toLowerCase();
  const list=(MATCHES||[]).filter(m=>!f||[m.title,m.subtitle,m.tableName,...m.players.map(p=>p.name)].join(' ').toLowerCase().includes(f));
  $('history').innerHTML=list.length?list.map(m=>{const [a,b]=m.players, d=new Date(m.at);
    return `<div class="m" data-id="${m.id}">
      <div class="mh"><div class="md">${d.toLocaleDateString('ru-RU')}<br>${d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</div>
        <div style="min-width:0"><div class="mt">${esc(m.title)}${m.subtitle?' · '+esc(m.subtitle):''}${m.tableName?' · '+esc(m.tableName):''}</div>
          <div class="ms"><div class="a ${m.winner===0?'w':''}">${esc(a.name)}</div><div class="sc">${a.frames} : ${b.frames}</div><div class="b ${m.winner===1?'w':''}">${esc(b.name)}</div></div></div>
        <button class="btn d sm" data-del="${m.id}">✕</button></div>
      <div class="det"><table>${DET.map(([l,fn])=>`<tr><td>${fn(a)}</td><td class="l">${l}</td><td>${fn(b)}</td></tr>`).join('')}</table></div>
    </div>`}).join(''):'<div class="empty">'+(f?'Ничего не найдено.':'Сохранённых матчей пока нет. На пульте нажмите «Сохранить матч» в конце игры.')+'</div>';
}
$('hFilter').oninput=renderHistory;
$('history').onclick=async e=>{
  const b=e.target.closest('button'), m=e.target.closest('.m'); if(!m) return;
  if(b&&b.dataset.del){ confirmBtn(b,async()=>{ await api('/api/matches/'+b.dataset.del,{method:'DELETE'}); toast('Матч удалён'); loadHistory(); },'Удалить?'); return; }
  m.classList.toggle('open');
};

/* ---------- settings ---------- */
async function loadMe(){
  const me=await api('/api/me'); let w='';
  if(me.defaultPassword) w+='<div class="warn"><b>Пароль по умолчанию «admin».</b> Задайте свой пароль в переменной окружения ADMIN_PASSWORD в настройках приложения Timeweb.</div>';
  if(me.storage!=='postgres') w+='<div class="warn"><b>База данных не подключена.</b> Timeweb удаляет файлы при каждом новом деплое, поэтому игроки и история пропадут при обновлении сайта. Подключите PostgreSQL (переменная DATABASE_URL) или скачивайте резервную копию в «Настройках».</div>';
  $('warns').innerHTML=w;
  $('storageInfo').innerHTML=me.storage==='postgres'?'Данные хранятся в базе PostgreSQL — они сохраняются при обновлениях сайта.':'Данные хранятся в файле на сервере. Подключите PostgreSQL, чтобы они не пропадали при обновлении.';
}
$('restore').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ const j=JSON.parse(await f.text()); await api('/api/restore',{method:'POST',body:j}); toast('Данные восстановлены'); MATCHES=null; showTab('tables'); }
  catch(_){ toast('Не удалось восстановить',true); }
  e.target.value='';
};
$('logout').onclick=async()=>{ await fetch('/api/logout'); location.href='/login'; };

loadMe();
document.querySelector('#addPlayer [data-form]').innerHTML=formHTML();
{const h=(location.hash||'').slice(1); showTab(['tables','players','history','settings'].includes(h)?h:'tables');}
setInterval(()=>{ if($('v-tables').classList.contains('act')&&!document.querySelector('#tables .editing')) loadTables().catch(()=>{}); },5000);
</script>
