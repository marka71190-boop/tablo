<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход · Табло пирамида</title>
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;font-family:'Roboto Condensed',system-ui,sans-serif;color:#e9edf5;
  background:radial-gradient(ellipse at 50% 30%,#1f7445 0,#0e3f27 40%,#05140d 100%);padding:20px}
.box{width:100%;max-width:380px;background:rgba(9,14,32,.94);border:1px solid #1d2742;border-radius:16px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
h1{font:600 26px Oswald;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
h1 b{color:#e4002b}
p{color:#8590aa;font-size:14px;margin-bottom:22px}
input{width:100%;background:#070b16;border:1px solid #26314f;color:#fff;border-radius:10px;padding:14px;font:inherit;font-size:17px}
button{width:100%;margin-top:14px;border:0;border-radius:10px;padding:14px;font:600 18px Oswald;text-transform:uppercase;letter-spacing:1px;color:#fff;background:#e4002b;cursor:pointer}
.err{color:#ff8a99;font-size:14px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<form class="box" id="f">
  <h1><b>●</b> Табло · Пирамида</h1>
  <p>Вход для оператора</p>
  <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" autofocus>
  <button type="submit">Войти</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=document.getElementById('err'); err.textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});
    const j=await r.json();
    if(!r.ok){ err.textContent=j.error||'Ошибка входа'; return; }
    const next=new URLSearchParams(location.search).get('next')||'/';
    location.href=/^\/[\w\/-]*$/.test(next)?next:'/';
  }catch(_){ err.textContent='Нет связи с сервером'; }
});
</script>
</body>
</html>
